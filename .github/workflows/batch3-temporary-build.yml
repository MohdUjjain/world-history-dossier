name: Temporary rebuild Batch 3 publication
on:
  push:
    branches: [audit/batch3-edition-clarity-20261106]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/build.py -o index.html && python src/build.py -o index.html --check
      - name: Commit regenerated offline publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate History edition assets after cache handover fix'
            git push origin HEAD:audit/batch3-edition-clarity-20261106
          fi

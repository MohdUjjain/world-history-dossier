name: Temporary Batch 3 source-to-publication rebuild
on:
  push:
    branches:
      - audit/batch3-edition-clarity-20261106
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble reproducible World History reader and worker
        run: |
          python src/build.py -o index.html
          python src/build.py -o index.html --check
      - name: Commit only deterministic generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate World History publication assets for Batch 3'
            git push origin HEAD:audit/batch3-edition-clarity-20261106
          fi

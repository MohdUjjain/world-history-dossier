name: Build bookmarked history dossier PDF

on:
  push:
    branches: [main]
    paths:
      # Only print engine, authored content and dedicated PDF-tool changes
      # should automatically regenerate the heavyweight bookmarked PDF.
      - 'src/engine.js'
      - 'src/chapters/**'
      - 'src/tools/export_full_pdf.py'
      - 'src/tests/validate_pdf_navigation.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dossier-pdf-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF builder dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright beautifulsoup4 lxml pymupdf
          python -m playwright install --with-deps chromium
      - name: Verify standalone HTML build
        run: |
          python src/build.py -o index.html --check
          python src/tests/validate_structure.py
      - name: Generate chapter-indexed and bookmarked PDF
        run: |
          python src/tools/export_full_pdf.py --book index.html --out '20th-Century International History.pdf' --batch-size 16 --chromium auto --qa PDF_MERGE_QA.json
          python src/tests/validate_pdf_navigation.py '20th-Century International History.pdf'
      - name: Commit updated PDF when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '20th-Century International History.pdf'
          if git diff --cached --quiet; then
            echo 'PDF is already current.'
          else
            git commit -m 'Update bookmarked PDF with chapter-only index'
            # A PDF build may overlap source/docs pushes. Rebase the PDF-only
            # commit onto the newest main branch instead of failing the build.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another commit; retrying ($attempt/3)"
              sleep 2
            done
            echo 'Unable to publish the generated PDF after three attempts' >&2
            exit 1
          fi
